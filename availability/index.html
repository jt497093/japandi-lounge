<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>Availability | Japandi Lounge</title>

  <meta
    name="description"
    content="Check availability for Japandi Lounge near Den Bosch and contact us directly for bookings and pricing."
  >

  <meta name="robots" content="index, follow">

  <link
    rel="canonical"
    href="https://japandilounge.com/availability/"
  >


  <style>

    :root {

      --bg: #eee0cf;
      --bg-soft: #f5ecdf;
      --card: #f8f1e8;

      --text: #1d1d1b;
      --muted: #655f57;

      --accent: #1d1d1b;
      --accent-soft: #dfc6a8;

      --line: rgba(29, 29, 27, 0.12);

      --shadow:
        0 18px 45px rgba(40, 30, 20, 0.08);

      --radius: 20px;

      --max: 1100px;
    }


    * {
      box-sizing: border-box;
    }


    html {
      scroll-behavior: smooth;
      scroll-padding-top: 96px;
    }


    html,
    body {
      margin: 0;
      padding: 0;
    }


    body {

      font-family:
        "Helvetica Neue",
        Helvetica,
        Arial,
        sans-serif;

      color: var(--text);

      background: var(--bg-soft);

      line-height: 1.6;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    a:hover {
      opacity: 0.82;
    }


    .container {

      width:
        min(
          var(--max),
          calc(100% - 36px)
        );

      margin: 0 auto;
    }



    /* =========================
       NAVIGATION
       ========================= */


    .topbar {

      position: sticky;

      top: 0;

      z-index: 30;

      backdrop-filter:
        blur(14px);

      background:
        rgba(245, 236, 223, 0.92);

      border-bottom:
        1px solid var(--line);
    }


    .nav {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      min-height: 72px;

      gap: 20px;
    }


    .brand {

      font-size: 17px;

      font-weight: 600;

      text-transform:
        uppercase;

      letter-spacing:
        4px;

      white-space:
        nowrap;
    }


    .navlinks {

      display: flex;

      align-items: center;

      justify-content:
        flex-end;

      gap: 5px;

      flex-wrap: wrap;
    }


    .navlinks a {

      padding:
        9px 11px;

      border-radius:
        10px;

      color:
        var(--muted);

      font-size:
        13px;

      letter-spacing:
        0.3px;
    }


    .navlinks a:hover {
      color: var(--text);
    }


    .navlinks a.active {

      color:
        var(--text);

      background:
        rgba(248, 241, 232, 0.95);
    }


    .navlinks a.cta {

      background:
        var(--accent);

      color:
        #ffffff;

      padding-left:
        16px;

      padding-right:
        16px;
    }



    /* =========================
       PAGE HEADER
       ========================= */


    .pageHeader {

      padding:
        42px 0 20px;

      text-align:
        center;
    }


    h1 {

      margin:
        0 0 14px;

      font-size:
        clamp(
          34px,
          5vw,
          52px
        );

      font-weight:
        400;

      line-height:
        1.08;

      letter-spacing:
        3px;

      text-transform:
        uppercase;
    }


    .intro {

      max-width:
        650px;

      margin:
        0 auto;

      color:
        var(--muted);

      font-size:
        16px;
    }



    /* =========================
       CALENDAR
       ========================= */


    .calendarSection {

      padding:
        16px 0 30px;
    }


    .calendarCard {

      border:
        1px solid var(--line);

      background:
        rgba(248, 241, 232, 0.82);

      border-radius:
        var(--radius);

      box-shadow:
        var(--shadow);

      padding:
        12px;

      overflow:
        hidden;
    }


    .calendar-container {

      width:
        100%;

      border-radius:
        14px;

      overflow:
        hidden;

      background:
        #ffffff;
    }


    iframe {

      width:
        100%;

      height:
        700px;

      border:
        0;

      display:
        block;
    }


    /* =========================
       FOOTER
       ========================= */


    .footer {

      padding:
        30px 0 40px;

      border-top:
        1px solid var(--line);

      color:
        var(--muted);

      font-size:
        13px;
    }


    .footer-inner {

      display:
        flex;

      gap:
        10px;

      flex-wrap:
        wrap;

      align-items:
        center;

      justify-content:
        space-between;
    }



    /* =========================
       MOBILE
       ========================= */


    @media (max-width: 720px) {


      .container {

        width:
          min(
            var(--max),
            calc(100% - 24px)
          );
      }


      .nav {

        align-items:
          flex-start;

        flex-direction:
          column;

        padding:
          15px 0;
      }


      .brand {

        letter-spacing:
          3px;
      }


      .navlinks {

        justify-content:
          flex-start;
      }


      .pageHeader {

        padding-top:
          32px;
      }


      iframe {

        height:
          620px;
      }


      .calendarCard {

        padding:
          7px;
      }

    }

  </style>

</head>



<body>


<!-- =========================
     NAVIGATION
     ========================= -->


<header class="topbar">

  <div class="container">

    <nav class="nav">


      <a
        class="brand"
        href="/">

        Japandi Lounge

      </a>


      <div class="navlinks">


        <a href="/">
          Home
        </a>





        <a
          href="https://wa.me/31615230319"
          target="_blank"
          rel="noopener"
          class="cta">

          WhatsApp Booking

        </a>


      </div>


    </nav>

  </div>

</header>



<main>


  <!-- PAGE TITLE -->


  <section class="pageHeader">

    <div class="container">


      <h1>

        Availability

      </h1>


      <p class="intro">

        Check the calendar below for available dates.
        For pricing, group enquiries or direct bookings,
        contact us via WhatsApp.

      </p>


    </div>

  </section>



  <!-- CALENDAR -->


  <section class="calendarSection">

    <div class="container">


      <div class="calendarCard">


        <div class="calendar-container">


          <iframe
            src="https://calendar.google.com/calendar/embed?src=ehth92ekqk802h7s1fldlb1epn0shs9k%40import.calendar.google.com&ctz=Europe%2FAmsterdam"
            title="Japandi Lounge availability calendar">

          </iframe>


        </div>


      </div>



    </div>

  </section>


</main>



<a
  class="whatsapp-float"
  href="https://wa.me/31615230319"
  target="_blank"
  rel="noopener"
  aria-label="Contact Japandi Lounge on WhatsApp"
  title="WhatsApp">
  <svg
    viewBox="0 0 24 24"
    width="24"
    height="24"
    aria-hidden="true"
    focusable="false">
    <path
      fill="currentColor"
      d="M12 3a8 8 0 0 0-6.8 12.2L4 21l5.9-1.1A8 8 0 1 0 12 3Zm0 2a6 6 0 1 1-1.6 11.8l-.4-.1-3.4.6.7-3.3-.2-.4A6 6 0 0 1 12 5Z"/>
  </svg>
</a>


<!-- =========================
     FOOTER
     ========================= -->


<footer class="footer">

  <div class="container">


    <div class="footer-inner">


      <div>

        © <span id="y"></span> Japandi Lounge

      </div>


      <div>

        WhatsApp:

        <a href="https://wa.me/31615230319">

          +31 6 15230319

        </a>

      </div>


    </div>


  </div>

</footer>



<script>

  document.getElementById("y").textContent =
    new Date().getFullYear();

</script>


</body>

</html>
